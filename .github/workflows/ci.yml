name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-python-${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install ".[test]"

      - name: Test
        run: python -m pytest -q -ra tests/python

      - name: The installed program
        run: |
          vts --version
          vts config --help
          vts --offline doctor || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check vts tests

  # the Windows install script, as people run it
  windows-install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        programs: [without, with]
    name: windows-install-${{ matrix.programs }}-programs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install with the script
        shell: powershell
        env:
          VTS_NO_WINGET: ${{ matrix.programs == 'without' && '1' || '' }}
        run: powershell -ExecutionPolicy Bypass -File install.ps1

      - name: The installed vts
        shell: powershell
        run: |
          $bin = (py -3.13 -m pipx environment --value PIPX_BIN_DIR).Trim()
          & "$bin\vts.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$bin\vts.exe" --offline doctor
          exit 0
